<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПР3 — Проверки</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Браузерные проверки</h1>
    <p>Открой DevTools → Console, результаты выводятся туда</p>
  </header>

  <main class="page-main">
    <p id="empty-message" hidden></p>
    <ul id="task-list" class="task-list"></ul>
    <section id="task-summary" class="summary" hidden>
      <div class="summary-item"><span class="summary-label">Всего</span><span data-stat="total">0</span></div>
      <div class="summary-item"><span class="summary-label">Выполнено</span><span data-stat="completed">0</span></div>
      <div class="summary-item"><span class="summary-label">Осталось</span><span data-stat="pending">0</span></div>
      <div class="summary-item"><span class="summary-label">Прогресс</span><span data-stat="progress">0.0%</span></div>
      <div class="summary-item"><span class="summary-label">Показано</span><span data-stat="visible">0</span></div>
    </section>
    <div id="filters">
      <button type="button" data-filter="all" class="is-active">Все</button>
      <button type="button" data-filter="pending">В работе</button>
      <button type="button" data-filter="completed">Выполненные</button>
    </div>
    <p id="operation-message"></p>
    <script type="module" src="./checks/browser.checks.js"></script>
  </main>
</body>
</html>
