<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПР3 — Список задач</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Список задач</h1>
    <p>Демонстрация работы с DOM и событиями</p>
  </header>

  <main class="page-main">
    <section id="task-summary" class="summary">
      <div class="summary-item">
        <span class="summary-label">Всего</span>
        <span class="summary-value" data-stat="total">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">Выполнено</span>
        <span class="summary-value" data-stat="completed">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">Осталось</span>
        <span class="summary-value" data-stat="pending">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">Прогресс</span>
        <span class="summary-value" data-stat="progress">0.0%</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">Показано</span>
        <span class="summary-value" data-stat="visible">0</span>
      </div>
    </section>

    <section id="filters" class="filters">
      <button type="button" data-filter="all" class="is-active" aria-pressed="true">Все</button>
      <button type="button" data-filter="pending" aria-pressed="false">В работе</button>
      <button type="button" data-filter="completed" aria-pressed="false">Выполненные</button>
    </section>

    <p id="operation-message" class="operation-message" aria-live="polite"></p>

    <p id="empty-message" class="empty-message" hidden></p>

    <ul id="task-list" class="task-list"></ul>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
