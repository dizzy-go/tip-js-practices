<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПР3 — Эксперименты с DOM и событиями</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="page-header">
    <h1>Эксперименты с DOM и событиями</h1>
    <p>Открой DevTools → Console</p>
  </header>

  <main class="page-main">
    <section>
      <h2>Список записей</h2>
      <button id="add-record" type="button">Добавить запись</button>
      <ul id="records"></ul>
    </section>

    <section>
      <h2>Вложенная кнопка</h2>
      <div id="wrapper">
        <button id="edit" type="button">
          <span class="label">Изменить заголовок</span>
        </button>
      </div>
    </section>

    <section>
      <h2>Журнал</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script type="module" src="./dom-events.js"></script>
</body>
</html>
